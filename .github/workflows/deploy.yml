name: Deploy to Cloudflare Pages

on:
  # Manual trigger with option for full refresh
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full refresh of all 6 seasons from nflverse'
        required: false
        default: false
        type: boolean
  
  # Auto-deploy on push to main
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  
  # Timezone-aware hybrid refresh schedule.
  # Live runs avoid the top of the hour because scheduled Actions are more
  # likely to be delayed then. Full current-season runs happen nightly and
  # shortly after each prime-time game window.
  schedule:
    - cron: '17 3 * * *'
      timezone: 'America/New_York'
    - cron: '17 0 * * 1,2,5'
      timezone: 'America/New_York'
    - cron: '17,47 20-23 * * 4'
      timezone: 'America/New_York'
    - cron: '17,47 13-23 * * 0'
      timezone: 'America/New_York'
    - cron: '17,47 20-23 * * 1'
      timezone: 'America/New_York'

concurrency:
  group: fantasy-loser-production
  cancel-in-progress: true

jobs:
  generate-data:
    name: Generate Fantasy Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run data helper tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      
      - name: Create output directories
        run: |
          mkdir -p output
          mkdir -p website/public/data

      - name: Select player lookup cache date
        id: player-cache-date
        shell: bash
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily player lookup
        uses: actions/cache@v4
        with:
          path: output/players_lookup.json
          key: sleeper-player-lookup-${{ steps.player-cache-date.outputs.date }}
          restore-keys: |
            sleeper-player-lookup-

      - name: Select refresh mode
        id: refresh-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          mode="$(python scripts/select_refresh_mode.py \
            --event-name "$EVENT_NAME" \
            --schedule "$SCHEDULE" \
            --full-refresh "$FULL_REFRESH")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected refresh mode: $mode"

      - name: Restore last deployed nflverse data
        if: steps.refresh-mode.outputs.mode == 'gameday'
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://fantasyloser.pages.dev/data"
          files=(
            player_stats.json
            defense_stats.json
            dst_stats.json
            kicker_stats.json
            scoring_config.json
            dynasty_playoff_predictions.json
          )
          for file in "${files[@]}"; do
            echo "Restoring $file from the last good deployment..."
            if [[ "$file" == "dynasty_playoff_predictions.json" ]]; then
              curl --fail --silent --show-error --location \
                --retry 3 --retry-delay 2 \
                "$base_url/$file" \
                --output "website/public/data/$file"
            else
              curl --fail --silent --show-error --location \
                --retry 3 --retry-delay 2 \
                "$base_url/$file" \
                --output "output/$file"
              cp "output/$file" "website/public/data/$file"
            fi
          done

      - name: Generate data files
        env:
          REFRESH_MODE: ${{ steps.refresh-mode.outputs.mode }}
        run: |
          echo "Running $REFRESH_MODE refresh..."
          python scripts/generate_data.py "--$REFRESH_MODE"
      
      - name: Copy data to website
        run: |
          cp output/*.json website/public/data/
          # Build-only databases are not consumed by Astro and must not be
          # deployed. The enriched file is also above the Pages file limit.
          rm -f \
            website/public/data/enriched_player_stats.json \
            website/public/data/players_data.json \
            website/public/data/players_lookup.json
          
          # Determine if we're in-season (after Sept 8 2026).
          # During preseason, create harmless placeholders so the site can build.
          # During the season, FAIL the build if critical data is missing — this
          # prevents a transient API error from deploying a broken "preseason" site.
          # Cloudflare will keep serving the last good deployment.
          SEASON_STARTED=false
          if [ "$(date +%s)" -ge "$(date -d '2026-09-08' +%s)" ]; then
            SEASON_STARTED=true
          fi
          
          MISSING_CRITICAL=false
          
          create_or_fail() {
            local file="$1"
            local placeholder="$2"
            local label="$3"
            if [ ! -f "$file" ]; then
              if [ "$SEASON_STARTED" = "true" ]; then
                echo "❌ MISSING CRITICAL FILE: $label ($file) — season has started, refusing to use placeholder"
                MISSING_CRITICAL=true
              else
                echo "$placeholder" > "$file"
                echo "Created placeholder $label (preseason)"
              fi
            fi
          }
          
          # Playoff predictions are optional (only generated mid-season)
          if [ ! -f website/public/data/dynasty_playoff_predictions.json ]; then
            echo '{"matchups":[],"team_predictions":[],"playoff_probabilities":{},"is_playoffs":false}' > website/public/data/dynasty_playoff_predictions.json
            echo "Created placeholder dynasty_playoff_predictions.json"
          fi
          
          # Critical data files — must exist during the season
          create_or_fail "website/public/data/season_stats_dynasty.json" \
            '{"league_id":"","league_name":"Dynasty League","season":"2026","current_week":0,"generated_at":"","teams":[],"best_theoretical_lineups":[],"avg_best_theoretical_lineup":0}' \
            "season_stats_dynasty.json"
          
          create_or_fail "website/public/data/season_stats_chopped.json" \
            '{"league_id":"","league_name":"Chopped League","season":"2026","current_week":0,"generated_at":"","teams":[],"best_theoretical_lineups":[],"avg_best_theoretical_lineup":0}' \
            "season_stats_chopped.json"
          
          create_or_fail "website/public/data/user_lineups_dynasty.json" \
            '{"league_name":"Dynasty","current_week":0,"users":[]}' \
            "user_lineups_dynasty.json"
          
          create_or_fail "website/public/data/user_lineups_chopped.json" \
            '{"league_name":"Chopped","current_week":0,"users":[]}' \
            "user_lineups_chopped.json"
          
          # Non-critical data files — placeholder is acceptable even in-season
          # (player/defense stats depend on nflverse which may lag)
          if [ ! -f website/public/data/player_stats.json ]; then
            echo '{"season":"2026","generated_at":"","players":[]}' > website/public/data/player_stats.json
            echo "Created placeholder player_stats.json"
          fi
          if [ ! -f website/public/data/kicker_stats.json ]; then
            echo '{"season":"2026","generated_at":"","players":[]}' > website/public/data/kicker_stats.json
            echo "Created placeholder kicker_stats.json"
          fi
          if [ ! -f website/public/data/dst_stats.json ]; then
            echo '{"season":"2026","generated_at":"","teams":[]}' > website/public/data/dst_stats.json
            echo "Created placeholder dst_stats.json"
          fi
          if [ ! -f website/public/data/defense_stats.json ]; then
            echo '{"season":"2026","generated_at":"","defenses":[]}' > website/public/data/defense_stats.json
            echo "Created placeholder defense_stats.json"
          fi
          if [ ! -f website/public/data/weekly_reviews_dynasty.json ]; then
            echo '{"league_name":"Dynasty League","league_type":"dynasty","season":"2026","total_weeks":0,"league_faab_budget":100,"total_teams":0,"weeks":[],"faab_summary":{"total_league_spent":0,"total_league_budget":0,"cumulative_by_week":[],"by_team":[],"top_moves":[]}}' > website/public/data/weekly_reviews_dynasty.json
            echo "Created placeholder weekly_reviews_dynasty.json"
          fi
          if [ ! -f website/public/data/weekly_reviews_chopped.json ]; then
            echo '{"league_name":"Chopped League","league_type":"chopped","season":"2026","total_weeks":0,"league_faab_budget":150,"total_teams":0,"weeks":[],"faab_summary":{"total_league_spent":0,"total_league_budget":0,"cumulative_by_week":[],"by_team":[],"top_moves":[]}}' > website/public/data/weekly_reviews_chopped.json
            echo "Created placeholder weekly_reviews_chopped.json"
          fi
          
          if [ "$MISSING_CRITICAL" = "true" ]; then
            echo ""
            echo "🚨 Build aborted: critical data files missing during active season."
            echo "   This is likely a transient Sleeper API failure. Cloudflare will"
            echo "   continue serving the last good deployment. Re-run the workflow."
            exit 1
          fi

          echo "Checking Cloudflare Pages 25 MiB per-file limit (24 MiB guard)..."
          oversized="$(find website/public/data -type f -size +24M -print)"
          if [ -n "$oversized" ]; then
            echo "Files exceed the 24 MiB deployment guard:"
            echo "$oversized"
            exit 1
          fi
      
      - name: Verify data files were generated
        run: |
          echo "Listing all JSON files in website/public/data/:"
          ls -lh website/public/data/*.json
          echo ""
          echo "Checking dynasty_playoff_predictions.json:"
          if [ -f website/public/data/dynasty_playoff_predictions.json ]; then
            echo "✓ File exists!"
            echo "Size: $(wc -c < website/public/data/dynasty_playoff_predictions.json) bytes"
            echo "Preview:"
            head -n 20 website/public/data/dynasty_playoff_predictions.json
          else
            echo "ℹ️ dynasty_playoff_predictions.json not found (expected in preseason)"
          fi
      
      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-data
          path: website/public/data/
          retention-days: 2
  
  deploy:
    name: Build and Deploy to Cloudflare
    needs: generate-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download data artifacts
        uses: actions/download-artifact@v4
        with:
          name: fantasy-data
          path: website/public/data/
      
      - name: Verify data files
        run: |
          echo "Checking for playoff predictions file..."
          ls -lh website/public/data/dynasty_playoff_predictions.json || echo "File not found!"
          echo "Last modified:"
          stat website/public/data/dynasty_playoff_predictions.json || echo "Cannot stat file"
          echo "First 500 chars of file:"
          head -c 500 website/public/data/dynasty_playoff_predictions.json || echo "Cannot read file"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      
      - name: Install dependencies
        working-directory: ./website
        run: npm ci
      
      - name: Build Astro site
        working-directory: ./website
        run: npm run build

      - name: Verify Cloudflare deployment file sizes
        shell: bash
        run: |
          oversized="$(find website/dist -type f -size +24M -print)"
          if [ -n "$oversized" ]; then
            echo "Built files exceed the 24 MiB deployment guard:"
            echo "$oversized"
            exit 1
          fi
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=fantasyloser --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
